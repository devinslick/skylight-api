[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skylight_api"
version = "0.1.0"
description = "An async Python client library for the Skylight Calendar API, designed for Home Assistant integrations."
readme = "README.md"
authors = [{ name = "Devin Slick" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "skylight",
    "skylight-calendar",
    "home-assistant",
    "async",
    "api-client",
    "family-calendar",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.8",
    "yarl>=1.9",
]

[project.urls]
Homepage = "https://github.com/devinslick/skylight-api"
Repository = "https://github.com/devinslick/skylight-api"
Issues = "https://github.com/devinslick/skylight-api/issues"
Documentation = "https://github.com/devinslick/skylight-api#readme"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "aioresponses>=0.7",
    # aiohttp 3.14 added a required stream_writer kwarg to ClientResponse.__init__,
    # which breaks aioresponses. Test-only pin, no environment marker: the break
    # is aiohttp-version-dependent, not Python-dependent.
    "aiohttp<3.14",
    "black",
    "flake8",
    "mypy>=1.0",
    "pre-commit",
]

[tool.setuptools.packages.find]
include = ["skylight_api*"]

[tool.setuptools.package-data]
skylight_api = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["skylight_api"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["aiohttp.*", "yarl.*"]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]
